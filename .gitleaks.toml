# gitleaks config — bloqueia secrets em PRs (PLAN item 48a).
# Roda em ci-fast.

title = "FEC gitleaks config"

[extend]
useDefault = true

[[rules]]
description = "Anthropic API key"
id = "anthropic-api-key"
regex = '''sk-ant-(?:api03|sid01)-[A-Za-z0-9_-]{50,}'''
keywords = ["sk-ant"]

[[rules]]
description = "OpenAI API key (modern)"
id = "openai-api-key-modern"
regex = '''sk-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-"]
[rules.allowlist]
paths = ['''.*\.example$''', '''docs/.*\.md$''']

[[rules]]
description = "Google AI Studio key"
id = "google-ai-key"
regex = '''AIza[0-9A-Za-z_-]{35}'''
keywords = ["AIza"]

[allowlist]
description = "Allowlisted paths and content"
paths = [
  '''\.gitleaks\.toml$''',
  '''SECURITY\.md$''',
  '''PLAN\.md$''',
  '''.*\.example$''',
  '''fixtures/recorded/.*''',  # gravações deterministicas, sem secrets
]
regexes = [
  '''sk-fake-.*''',  # placeholders em docs
  '''sk-example-.*''',
]
