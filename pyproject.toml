[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fec-sdk"
version = "1.0.0"
description = "Cliente provider-neutral da Formação de Engenharia de Contexto (FEC)."
readme = "fec_sdk/README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [
  { name = "INEMA", email = "fec@inema.club" }
]
keywords = ["llm", "context-engineering", "rag", "agents", "evals"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "tenacity>=8.5,<10",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40,<1"]
openai    = ["openai>=1.50,<2"]
google    = ["google-generativeai>=0.8,<1"]
ollama    = ["ollama>=0.5,<1"]
all       = ["fec-sdk[anthropic,openai,google,ollama]"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "jsonschema>=4.21",
]

[project.urls]
Homepage      = "https://github.com/inematds/FEC"
Documentation = "https://inematds.github.io/FEC/latest/"
Issues        = "https://github.com/inematds/FEC/issues"

[tool.hatch.build.targets.wheel]
packages = ["fec_sdk"]

[tool.hatch.build.targets.sdist]
include = ["fec_sdk/**", "README.md", "LICENSE-CODE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "PL", "RUF"]
ignore = ["PLR0913", "PLR0912", "PLR0915"]

[tool.pytest.ini_options]
testpaths = ["tests", "exercicios"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"
markers = [
  "slow: tests that take >5s",
  "network: tests that require live network (skipped in ci-fast)",
  "provider: tests that exercise live provider APIs (scheduled only)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
