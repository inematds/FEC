<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="auto" role="img" aria-labelledby="janela-title-l janela-desc-l" font-family="Inter, system-ui, sans-serif">
  <title id="janela-title-l">Anatomia da janela de contexto</title>
  <desc id="janela-desc-l">Sistema prompt e few-shot estáveis (verde) no início, contexto recuperado variável (azul) no meio, user turn no fim (amarelo), modelo (roxo) gera resposta.</desc>

  <defs>
    <marker id="arr-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <rect width="900" height="380" fill="#fafafa"/>

  <!-- System prompt -->
  <g>
    <rect x="20" y="40" width="180" height="80" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
    <text x="110" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">System prompt</text>
    <text x="110" y="88" text-anchor="middle" font-size="11" fill="#047857">(estável — cache reuso)</text>
    <text x="110" y="106" text-anchor="middle" font-size="11" fill="#065f46">persona, regras, formato</text>
  </g>

  <!-- Few-shot -->
  <g>
    <rect x="220" y="40" width="180" height="80" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
    <text x="310" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Few-shot</text>
    <text x="310" y="88" text-anchor="middle" font-size="11" fill="#047857">(estável — cache reuso)</text>
    <text x="310" y="106" text-anchor="middle" font-size="11" fill="#065f46">2-N exemplos fixos</text>
  </g>

  <!-- Contexto recuperado -->
  <g>
    <rect x="420" y="40" width="240" height="80" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="540" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Contexto recuperado</text>
    <text x="540" y="88" text-anchor="middle" font-size="11" fill="#1d4ed8">(variável — RAG, ferramenta)</text>
    <text x="540" y="106" text-anchor="middle" font-size="11" fill="#1e40af">aqui mora a maior parte das decisões</text>
  </g>

  <!-- User turn -->
  <g>
    <rect x="680" y="40" width="200" height="80" rx="8" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
    <text x="780" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">User turn</text>
    <text x="780" y="88" text-anchor="middle" font-size="11" fill="#92400e">(ancorado no fim)</text>
    <text x="780" y="106" text-anchor="middle" font-size="11" fill="#78350f">a pergunta de fato</text>
  </g>

  <!-- Setas -->
  <line x1="200" y1="80" x2="220" y2="80" stroke="#525252" stroke-width="2" marker-end="url(#arr-l)"/>
  <line x1="400" y1="80" x2="420" y2="80" stroke="#525252" stroke-width="2" marker-end="url(#arr-l)"/>
  <line x1="660" y1="80" x2="680" y2="80" stroke="#525252" stroke-width="2" marker-end="url(#arr-l)"/>
  <line x1="450" y1="170" x2="450" y2="200" stroke="#525252" stroke-width="2" marker-end="url(#arr-l)"/>

  <!-- Modelo -->
  <g>
    <rect x="340" y="210" width="220" height="70" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="450" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#581c87">Modelo (LLM)</text>
    <text x="450" y="260" text-anchor="middle" font-size="11" fill="#6b21a8">atenção causal • KV cache</text>
  </g>

  <line x1="450" y1="280" x2="450" y2="310" stroke="#525252" stroke-width="2" marker-end="url(#arr-l)"/>

  <!-- Resposta -->
  <g>
    <rect x="370" y="320" width="160" height="40" rx="20" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
    <text x="450" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Resposta</text>
  </g>

  <text x="20" y="170" font-size="11" fill="#525252">Esquerda → direita: ordem na janela. Estável primeiro maximiza cache.</text>
</svg>
