<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="auto" role="img" aria-labelledby="janela-title janela-desc" font-family="Inter, system-ui, sans-serif">
  <title id="janela-title">Anatomia da janela de contexto</title>
  <desc id="janela-desc">Sistema prompt e few-shot estáveis (verde) no início, contexto recuperado variável (azul) no meio, user turn no fim (amarelo), modelo (roxo) gera resposta.</desc>

  <defs>
    <marker id="arr-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa"/>
    </marker>
  </defs>

  <!-- Bloco: System prompt -->
  <g>
    <rect x="20" y="40" width="180" height="80" rx="8"
          fill="#10b98122" stroke="#10b981" stroke-width="2"/>
    <text x="110" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">System prompt</text>
    <text x="110" y="88" text-anchor="middle" font-size="11" fill="#a7f3d0">(estável — cache reuso)</text>
    <text x="110" y="106" text-anchor="middle" font-size="11" fill="#d1fae5">persona, regras, formato</text>
  </g>

  <!-- Bloco: Few-shot -->
  <g>
    <rect x="220" y="40" width="180" height="80" rx="8"
          fill="#10b98122" stroke="#10b981" stroke-width="2"/>
    <text x="310" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">Few-shot</text>
    <text x="310" y="88" text-anchor="middle" font-size="11" fill="#a7f3d0">(estável — cache reuso)</text>
    <text x="310" y="106" text-anchor="middle" font-size="11" fill="#d1fae5">2-N exemplos fixos</text>
  </g>

  <!-- Bloco: Contexto recuperado -->
  <g>
    <rect x="420" y="40" width="240" height="80" rx="8"
          fill="#3b82f622" stroke="#3b82f6" stroke-width="2"/>
    <text x="540" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#60a5fa">Contexto recuperado</text>
    <text x="540" y="88" text-anchor="middle" font-size="11" fill="#bfdbfe">(variável — RAG, ferramenta)</text>
    <text x="540" y="106" text-anchor="middle" font-size="11" fill="#dbeafe">aqui mora a maior parte das decisões</text>
  </g>

  <!-- Bloco: User turn -->
  <g>
    <rect x="680" y="40" width="200" height="80" rx="8"
          fill="#facc1522" stroke="#facc15" stroke-width="2"/>
    <text x="780" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#facc15">User turn</text>
    <text x="780" y="88" text-anchor="middle" font-size="11" fill="#fde68a">(ancorado no fim)</text>
    <text x="780" y="106" text-anchor="middle" font-size="11" fill="#fef3c7">a pergunta de fato</text>
  </g>

  <!-- Setas horizontais -->
  <line x1="200" y1="80" x2="220" y2="80" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arr-d)"/>
  <line x1="400" y1="80" x2="420" y2="80" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arr-d)"/>
  <line x1="660" y1="80" x2="680" y2="80" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arr-d)"/>

  <!-- Linha de pipeline para modelo -->
  <line x1="450" y1="170" x2="450" y2="200" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arr-d)"/>

  <!-- Bloco: Modelo -->
  <g>
    <rect x="340" y="210" width="220" height="70" rx="8"
          fill="#a855f722" stroke="#a855f7" stroke-width="2"/>
    <text x="450" y="240" text-anchor="middle" font-size="14" font-weight="700" fill="#c084fc">Modelo (LLM)</text>
    <text x="450" y="260" text-anchor="middle" font-size="11" fill="#e9d5ff">atenção causal • KV cache</text>
  </g>

  <!-- Seta para resposta -->
  <line x1="450" y1="280" x2="450" y2="310" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arr-d)"/>

  <!-- Bloco: Resposta -->
  <g>
    <rect x="370" y="320" width="160" height="40" rx="20"
          fill="#facc1533" stroke="#facc15" stroke-width="2"/>
    <text x="450" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#facc15">Resposta</text>
  </g>

  <!-- Legenda -->
  <text x="20" y="170" font-size="11" fill="#a1a1aa">Esquerda → direita: ordem na janela. Estável primeiro maximiza cache.</text>
</svg>
