<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="auto" role="img" aria-labelledby="lim-title-l lim-desc-l" font-family="Inter, system-ui, sans-serif">
  <title id="lim-title-l">Lost in the middle — atenção não-uniforme</title>
  <desc id="lim-desc-l">Tokens no início e fim da janela recebem peso de atenção alto (verde); tokens no meio recebem peso degradado (vermelho). Acurácia cai ~30% quando informação crítica está no meio (Liu et al. 2023).</desc>

  <defs>
    <marker id="arr-l2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
    <marker id="arr-deg-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" fill-opacity="0.6"/>
    </marker>
  </defs>

  <rect width="900" height="460" fill="#fafafa"/>

  <text x="20" y="30" font-size="13" font-weight="700" fill="#18181b">Janela de contexto (10k tokens)</text>

  <!-- Início -->
  <g>
    <rect x="20" y="60" width="180" height="100" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="2.5"/>
    <text x="110" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">Tokens 1 — 1k</text>
    <text x="110" y="112" text-anchor="middle" font-size="11" fill="#065f46">início</text>
    <text x="110" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">atenção ALTA ✓</text>
    <text x="110" y="150" text-anchor="middle" font-size="10" fill="#065f46">prefix bias</text>
  </g>

  <!-- Meio (degradado) -->
  <g>
    <rect x="220" y="60" width="460" height="100" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="450" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Tokens 1k — 9k</text>
    <text x="450" y="112" text-anchor="middle" font-size="11" fill="#991b1b">meio (zona de degradação)</text>
    <text x="450" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">atenção BAIXA ✗</text>
    <text x="450" y="150" text-anchor="middle" font-size="10" fill="#991b1b">aqui o modelo "esquece"</text>
  </g>

  <!-- Fim -->
  <g>
    <rect x="700" y="60" width="180" height="100" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="2.5"/>
    <text x="790" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#064e3b">Tokens 9k — 10k</text>
    <text x="790" y="112" text-anchor="middle" font-size="11" fill="#065f46">fim</text>
    <text x="790" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">atenção ALTA ✓</text>
    <text x="790" y="150" text-anchor="middle" font-size="10" fill="#065f46">recency bias</text>
  </g>

  <!-- Setas -->
  <line x1="110" y1="160" x2="430" y2="280" stroke="#047857" stroke-width="2.5" marker-end="url(#arr-l2)"/>
  <text x="170" y="240" font-size="11" fill="#047857" font-weight="600">peso ✓</text>

  <line x1="450" y1="160" x2="450" y2="280" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-deg-l)" opacity="0.6"/>
  <text x="460" y="225" font-size="11" fill="#dc2626" font-weight="600">peso ✗ degradado</text>

  <line x1="790" y1="160" x2="470" y2="280" stroke="#047857" stroke-width="2.5" marker-end="url(#arr-l2)"/>
  <text x="700" y="240" font-size="11" fill="#047857" font-weight="600">peso ✓</text>

  <!-- Resposta -->
  <g>
    <rect x="370" y="285" width="160" height="50" rx="25" fill="#fef3c7" stroke="#a16207" stroke-width="2.5"/>
    <text x="450" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Resposta</text>
  </g>

  <!-- Nota -->
  <g>
    <rect x="100" y="375" width="700" height="60" rx="8" fill="#f4f4f5" stroke="#52525b" stroke-width="1.5"/>
    <text x="120" y="400" font-size="12" font-weight="700" fill="#18181b">📄 Liu et al. (2023, ArXiv:2307.03172):</text>
    <text x="120" y="420" font-size="12" fill="#27272a">acurácia em QA cai até 30% quando a informação crítica está no meio da janela.</text>
  </g>
</svg>
