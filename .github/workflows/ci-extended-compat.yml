# ci-extended-compat.yml — combinações fora do core das 24 da matriz (PLAN item 83).
# Roda semanal e antes de release; sem orçamento crítico.

name: ci-extended-compat

on:
  schedule:
    - cron: "37 9 * * 1"  # Mondays 09:37 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-extended-compat
  cancel-in-progress: true

jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Populated by build-compat.py from compat.json extended_combinations.
        combination: ${{ fromJSON(vars.EXTENDED_COMBINATIONS || '[]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.combination.python }}
      - name: Install pinned versions
        run: |
          pip install fec-sdk==${{ matrix.combination.fec_sdk }}
          pip install ${{ matrix.combination.provider.name }}-sdk==${{ matrix.combination.provider.sdk_version }}
      - name: Run mocked exercise tests against this combination
        run: pytest exercicios/ --combination='${{ toJSON(matrix.combination) }}'
