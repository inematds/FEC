[lockfile]
schema_version = "1"
release = "v1.0.0"
generated_at = "2026-05-02T00:00:00Z"
python_version_window = ["3.11", "3.12"]

# Hash do próprio fec_sdk publicado neste release
[fec_sdk]
version = "1.0.0"
wheel = "fec_sdk-1.0.0-py3-none-any.whl"
sha256 = "PENDING"  # gerado pelo release.yml com SOURCE_DATE_EPOCH fixado
blake3 = "PENDING"
sdist_sha256 = "PENDING"

# Dependências runtime — versões e hashes pinados.
# (Estes hashes serão preenchidos quando o release.yml rodar contra os índices PyPI reais.)
[[deps]]
name = "httpx"
version = "0.27.2"
hash = "PENDING"

[[deps]]
name = "pydantic"
version = "2.9.2"
hash = "PENDING"

[[deps]]
