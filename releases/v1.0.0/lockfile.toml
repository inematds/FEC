version = "9.0.0"
hash = "PENDING"

# Optional extras pinned per provider — usuário escolhe via `pip install fec-sdk[anthropic]`
[extras.anthropic]
deps = [
  { name = "anthropic", version = "0.40.0", hash = "PENDING" },
]

[extras.openai]
